<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sakura Financial Statement{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
    background: linear-gradient(
        rgba(248,244,238,0.90),
        rgba(248,244,238,0.90)
    ),
    url("{{ url_for('static', filename='images/sakura_bg.jpg') }}");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    font-family:'Quicksand', sans-serif;
}

/* Navbar */

.navbar{
    background:rgba(216,156,164,0.92) !important;
    backdrop-filter:blur(8px);
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.navbar-brand{
    font-family:'Cormorant Garamond', serif;
    font-size:32px;
    font-weight:700;
}

.nav-link{
    color:white !important;
    font-size:17px;
    font-weight:600;
}

.nav-link:hover{
    color:#fff8f9 !important;
}

/* Card utama */

.main-card{
    background:rgba(255,248,249,0.88);

    backdrop-filter:blur(8px);

    border:none;

    border-radius:30px;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);

    padding:20px;
}

/* Tombol umum */

.btn-pink{
    background:#d89ca4;
    color:white;
    border:none;
}

.btn-pink:hover{
    background:#c67f89;
    color:white;
}

/* Dashboard menu */

.menu-btn{

    border:none;

    border-radius:25px;

    height:85px;

    font-size:22px;

    font-weight:600;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:0.3s;

    box-shadow:0 8px 18px rgba(0,0,0,0.08);
}

.menu-btn:hover{
    transform:translateY(-5px);
}

/* Variasi warna menu */

.btn1{
    background:#f4c2c2;
    color:#6d5960;
}

.btn2{
    background:#fff8f0;
    color:#6d5960;
}

.btn3{
    background:#d8e2c8;
    color:#4f5b48;
}

.btn4{
    background:#d6e8f5;
    color:#4f6070;
}

.btn5{
    background:#ffd8be;
    color:#7d6047;
}

.btn6{
    background:#e3d5ff;
    color:#6b5d83;
}

/* Judul */

h1,h2,h3,h4{
    font-family:'Cormorant Garamond', serif;
    color:#6d5960;
}

/* Table */

.table{
    background:white;
    border-radius:15px;
    overflow:hidden;
}

.table thead{
    background:#d89ca4;
    color:white;
}

/* Responsive */

@media(max-width:768px){

    .menu-btn{
        height:75px;
        font-size:18px;
    }

    .navbar-brand{
        font-size:24px;
    }

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
    <img src="{{ url_for('static', filename='logo.png') }}"
         alt="Logo"
         style="width:70px;height:70px;margin-right:30px;vertical-align:middle;">

    Sakura Financial Statement
</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/laporan">
                        Laporan
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container">

    <div class="main-card">

        {% block content %}
        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
