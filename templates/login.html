<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Financial Statement</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Poppins', sans-serif;

            background-image:url("{{ url_for('static', filename='sakura.gif') }}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            position:relative;
        }

        /* Overlay pink soft */
        body::before{
            content:"";
            position:absolute;
            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(255,192,203,0.35);

            z-index:1;
        }

        .container-login{
            position:relative;
            z-index:2;

            width:550px;

            background:rgba(255,255,255,0.85);

            backdrop-filter:blur(8px);

            border-radius:25px;

            padding:50px;

            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        h1{
            font-size:38px;
            margin-bottom:15px;
            color:#2b2b2b;
            line-height:1.2;
            text-align:center;
        }

        p{
            color:#6f6f6f;
            margin-bottom:35px;
            font-size:16px;
            line-height:1.6;
            text-align:center;
        }

        form{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-bottom:8px;
            font-size:16px;
            color:#444;
        }

        input{
            padding:14px;
            margin-bottom:20px;

            border:1px solid #d4cec3;

            background:white;

            font-size:15px;

            border-radius:8px;

            outline:none;

            transition:0.3s;
        }

        input:focus{
            border:1px solid #d89ca4;
            box-shadow:0 0 8px rgba(216,156,164,0.4);
        }

        button{
            padding:15px;

            border:none;

            background:#d89ca4;

            color:white;

            font-size:18px;

            cursor:pointer;

            border-radius:10px;

            transition:0.3s;
        }

        button:hover{
            background:#c67f89;
            transform:scale(1.02);
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:15px;
            font-size:14px;
        }

    </style>

</head>

<body>

    <div class="container-login">

        <h1>
            Welcome to Sakura<br>
            Financial Statements
        </h1>

        <p>
            Preserve your precious memories with Sakura Photography.
            Every frame tells a story worth remembering.
        </p>

        {% if pesan %}
        <div class="error">
            {{ pesan }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

    </div>

</body>

</html>
